# Пример: закрыть прямой доступ к /uploads на хосте Strapi (только с внутренней сети / VPN).
# Браузер пользователя ходит на Next.js /api/media/file (JWT), Next проксирует на Strapi с сервера.
#
# Подставьте:
#   STRAPI_UPSTREAM — адрес Strapi (127.0.0.1:1337 или внутренний hostname)
#   ALLOWED_CIDRS — подсети, откуда разрешён прямой доступ (например Docker-сеть Next, офис)
#
# Вариант A: location только для uploads
# map $remote_addr $uploads_allowed { default 0; 10.0.0.0/8 1; 172.16.0.0/12 1; }
# server {
#   listen 443 ssl;
#   server_name api.example.com;
#   location /uploads/ {
#     if ($uploads_allowed = 0) { return 403; }
#     proxy_pass http://STRAPI_UPSTREAM;
#   }
#   location / { proxy_pass http://STRAPI_UPSTREAM; }
# }
#
# Вариант B: отдельный internal listener только для Next (рекомендуется при разделении портов)
